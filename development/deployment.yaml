apiVersion: apps/v1
kind: Deployment
metadata:
  name: gha-cicd-demo
  namespace: development
  labels:
    app: gha-cicd-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gha-cicd-demo
  template:
    metadata:
      labels:
        app: gha-cicd-demo
    spec:
      containers:
        - name: gha-cicd-demo
          image: sumitsinghrmga/gha-cicd-demo:736d4cb35a63611fb16fad7ce4e4e1149a216d87
          env:
            - name: DEPLOY_ENV
              value: development
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
